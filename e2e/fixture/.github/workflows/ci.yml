name: CI
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm run lint
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: npm test
  deploy:
    runs-on: ubuntu-latest
    needs: test
    environment: production
    steps:
      - run: echo deploy
